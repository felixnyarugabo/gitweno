
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Inventory System</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <div class="main">
        <h1>Inventory Management System</h1>

        <form id="productForm">
            <input type="number" id="id" placeholder="Product ID" required>
            <input type="text" id="name" placeholder="Product Name" required>
            <input type="number" id="price" placeholder="Price" min="0" required>
            <input type="number" id="stock" placeholder="Stock" min="0" required>

            <button type="submit">Add Product</button>
        </form>

        <input type="text" id="search" placeholder="Search products...">

        <div class="summary">
            <p>Total Products: <span id="totalProducts">0</span></p>
            <p>Total Stock: <span id="totalStock">0</span></p>
            <p>Inventory Value: KSh <span id="inventoryValue">0</span></p>
        </div>

        <div id="message"></div>

        <div id="display"></div>

        <button id="clear">Clear Inventory</button>
    </div>

    <script src="main.js"></script>
</body>
</html>
